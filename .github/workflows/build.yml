                  getWindow().setNavigationBarColor(BG);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  sv.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(28), dp(20), dp(28));
                  sv.addView(root);

                  TextView title = text("JARVIS Kontrol", 26, INK, true);
                  root.addView(title);
                  root.addView(text("Pendamping kacamata Q11-106C · ditenagai Claude", 14, MUTED, false), lp(-1, -2, 0, dp(2), 0, dp(20)));

                  // Kartu baterai
                  LinearLayout card = panel();
                  tvName = text("Mencari kacamata…", 17, INK, true);
                  card.addView(tvName);
                  tvConn = text("●  Memeriksa…", 14, MUTED, false);
                  card.addView(tvConn, lp(-1, -2, 0, dp(4), 0, dp(14)));

                  card.addView(text("BATERAI KACAMATA", 12, MUTED, true));
                  tvPct = text("--%", 64, MUTED, true);
                  tvPct.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  card.addView(tvPct, lp(-1, -2, 0, dp(2), 0, dp(8)));
                  bar = new BatteryBar(this);
                  card.addView(bar, lp(-1, dp(14), 0, 0, 0, dp(10)));
                  tvSrc = text("Menunggu data…", 13, MUTED, false);
                  card.addView(tvSrc);
                  root.addView(card, lp(-1, -2, 0, 0, 0, dp(16)));

                  tvHint = text("Kalau angka baterai tidak muncul: sebagian kacamata murah tidak mengirim info baterai ke HP. " +
                          "Coba buka Pengaturan → Bluetooth; jika persen baterai tampil di samping Q11-106C, aplikasi ini juga bisa membacanya " +
                          "setelah kacamata disambung ulang. Pastikan juga semua izin Bluetooth sudah diberikan.", 13, MUTED, false);
                  tvHint.setVisibility(View.GONE);
                  root.addView(tvHint, lp(-1, -2, 0, 0, 0, dp(16)));

                  // Tombol aksi
                  Button open = button("Buka JARVIS", true);
                  open.setOnClickListener(v -> openJarvis());
                  root.addView(open, lp(-1, dp(56), 0, 0, 0, dp(10)));

                  Button ref = button("Segarkan baterai", false);
                  ref.setOnClickListener(v -> { closeGatt(); level = -1; askPermissions(); start(); });
                  root.addView(ref, lp(-1, dp(50), 0, 0, 0, dp(10)));

                  Button bt = button("Pengaturan Bluetooth", false);
                  bt.setOnClickListener(v -> openBtSettings());
                  root.addView(bt, lp(-1, dp(50), 0, 0, 0, dp(10)));

                  Button perm = button("Izinkan Bluetooth & notifikasi", false);
                  perm.setOnClickListener(v -> {
                      askPermissions();
                      if (canConnect()) start();
                      else {
                          Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()));
                          try { startActivity(i); } catch (Exception ignored) { }
                      }
                  });
                  root.addView(perm, lp(-1, dp(50), 0, 0, 0, dp(24)));

                  // Daftar perangkat
                  root.addView(text("PILIH KACAMATA", 12, MUTED, true), lp(-1, -2, 0, 0, 0, dp(8)));
                  deviceList = new LinearLayout(this);
                  deviceList.setOrientation(LinearLayout.VERTICAL);
                  root.addView(deviceList);

                  root.addView(text("Cara pakai: nyalakan kacamata, pastikan tersambung di Bluetooth HP, lalu ketuk \"Buka JARVIS\". " +
                          "Di JARVIS, ketuk mikrofon sekali, lalu panggil \"Hi JARVIS\".", 13, MUTED, false), lp(-1, -2, 0, dp(20), 0, 0));

                  setContentView(sv);
              }

              LinearLayout panel() {
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(18), dp(18), dp(18), dp(18));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(PANEL);
                  g.setCornerRadius(dp(18));
                  g.setStroke(dp(1), LINE);
                  p.setBackground(g);
                  return p;
              }

              TextView text(String s, int sp, int col, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(col);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setLineSpacing(0, 1.15f);
                  return t;
              }

              Button button(String s, boolean primary) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  b.setTextColor(primary ? 0xFF14120A : INK);
                  b.setGravity(Gravity.CENTER);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(primary ? ACCENT : PANEL);
                  g.setCornerRadius(dp(14));
                  g.setStroke(dp(1), primary ? ACCENT : LINE);
                  b.setBackground(g);
                  b.setStateListAnimator(null);
                  return b;
              }

              LinearLayout.LayoutParams lp(int w, int h, int l, int t, int r, int bt) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          w == -1 ? ViewGroup.LayoutParams.MATCH_PARENT : w,
                          h == -2 ? ViewGroup.LayoutParams.WRAP_CONTENT : h);
                  p.setMargins(l, t, r, bt);
                  return p;
              }

              int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              /** Batang baterai sederhana. */
              static class BatteryBar extends View {
                  final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r = new RectF();
                  int pct = 0;

                  BatteryBar(Context c) {
                      super(c);
                      track.setColor(LINE);
                      fill.setColor(LINE);
                  }

                  void set(int p, int color) {
                      pct = Math.max(0, Math.min(100, p));
                      fill.setColor(color);
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float h = getHeight(), w = getWidth(), rad = h / 2f;
                      r.set(0, 0, w, h);
                      c.drawRoundRect(r, rad, rad, track);
                      if (pct > 0) {
                          r.set(0, 0, Math.max(h, w * pct / 100f), h);
                          c.drawRoundRect(r, rad, rad, fill);
                      }
                  }
              }
          }
