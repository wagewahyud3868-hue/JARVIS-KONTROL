              /** Cincin baterai bergaya HUD: busur persen, gerigi, dan cincin putus-putus yang berputar. */
              static class HudGauge extends View {
                  final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint arc = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint dash = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint tick = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint sub = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r = new RectF();
                  final float d;
                  int pct = -1;
                  int color = ACCENT;
                  float spin = 0f;

                  HudGauge(Context c) {
                      super(c);
                      d = c.getResources().getDisplayMetrics().density;
                      track.setStyle(Paint.Style.STROKE);
                      track.setStrokeWidth(10 * d);
                      track.setColor(0x2600E1FF);
                      arc.setStyle(Paint.Style.STROKE);
                      arc.setStrokeWidth(10 * d);
                      arc.setStrokeCap(Paint.Cap.ROUND);
                      dash.setStyle(Paint.Style.STROKE);
                      dash.setStrokeWidth(2 * d);
                      dash.setColor(0x9900E1FF);
                      dash.setPathEffect(new DashPathEffect(new float[]{6 * d, 9 * d}, 0));
                      tick.setStyle(Paint.Style.STROKE);
                      tick.setStrokeWidth(2 * d);
                      tick.setColor(0x6600E1FF);
                      txt.setTextAlign(Paint.Align.CENTER);
                      txt.setTypeface(Typeface.create(Typeface.MONOSPACE, Typeface.BOLD));
                      txt.setTextSize(44 * d);
                      sub.setColor(MUTED);
                      sub.setTextAlign(Paint.Align.CENTER);
                      sub.setTypeface(Typeface.MONOSPACE);
                      sub.setTextSize(11 * d);
                      sub.setLetterSpacing(0.25f);
                  }

                  void set(int p, int c) {
                      pct = Math.max(0, Math.min(100, p));
                      color = c;
                      invalidate();
                  }

                  void reset() {
                      pct = -1;
                      color = ACCENT;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth(), h = getHeight(), cx = w / 2f, cy = h / 2f;
                      float rad = Math.min(w, h) / 2f - 18 * d;
                      c.save();
                      c.rotate(spin, cx, cy);
                      c.drawCircle(cx, cy, rad + 12 * d, dash);
                      c.restore();
                      for (int i = 0; i < 60; i++) {
                          double a = Math.toRadians(i * 6 - spin / 3f);
                          float r1 = rad - 14 * d, r2 = rad - (i % 5 == 0 ? 24 : 18) * d;
                          c.drawLine(cx + (float) Math.cos(a) * r1, cy + (float) Math.sin(a) * r1,
                                  cx + (float) Math.cos(a) * r2, cy + (float) Math.sin(a) * r2, tick);
                      }
                      r.set(cx - rad, cy - rad, cx + rad, cy + rad);
                      c.drawArc(r, 0, 360, false, track);
                      if (pct >= 0) {
                          arc.setColor(color);
                          c.drawArc(r, -90, 360f * pct / 100f, false, arc);
                      }
                      txt.setColor(pct >= 0 ? color : MUTED);
                      c.drawText(pct >= 0 ? pct + "%" : "--%", cx, cy + 14 * d, txt);
                      c.drawText("BATERAI", cx, cy + 40 * d, sub);
                      spin = (spin + 0.5f) % 360f;
                      postInvalidateOnAnimation();
                  }
              }

              /** Latar hitam dengan grid halus. */
              static class GridDrawable extends android.graphics.drawable.Drawable {
                  final Paint p = new Paint();
                  final float step;

                  GridDrawable(float step) {
                      this.step = step;
                      p.setColor(0x1400E1FF);
                      p.setStrokeWidth(1f);
                  }

                  @Override
                  public void draw(Canvas c) {
                      android.graphics.Rect b = getBounds();
                      c.drawColor(BG);
                      for (float x = b.left; x < b.right; x += step) c.drawLine(x, b.top, x, b.bottom, p);
                      for (float y = b.top; y < b.bottom; y += step) c.drawLine(b.left, y, b.right, y, p);
                  }

                  @Override public void setAlpha(int a) { }
                  @Override public void setColorFilter(android.graphics.ColorFilter cf) { }
                  @Override public int getOpacity() { return android.graphics.PixelFormat.OPAQUE; }
              }

              /** Batang baterai sederhana (cadangan, tidak dipakai). */
              static class BatteryBar extends View {
                  final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r = new RectF();
                  int pct = 0;

                  BatteryBar(Context c) {
                      super(c);
                      track.setColor(LINE);
                      fill.setColor(LINE);
                  }

                  void set(int p, int color) {
                      pct = Math.max(0, Math.min(100, p));
                      fill.setColor(color);
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float h = getHeight(), w = getWidth(), rad = h / 2f;
                      r.set(0, 0, w, h);
                      c.drawRoundRect(r, rad, rad, track);
                      if (pct > 0) {
                          r.set(0, 0, Math.max(h, w * pct / 100f), h);
                          c.drawRoundRect(r, rad, rad, fill);
                      }
                  }
              }
          }
