          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Siapkan Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set +e
          cd proj && gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" = "0" || { echo "===== RINGKASAN ERROR ====="; grep -E "error:|\.java:[0-9]+|FAILURE|What went wrong" -A3 build.log | head -60; exit 1; }

      - name: Siapkan APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jarvis-v${{ github.run_number }}" JARVIS.apk \
            --repo "${{ github.repository }}" \
            --title "JARVIS (API Claude) v${{ github.run_number }}" \
            --notes "Unduh JARVIS.apk di bawah, lalu buka file-nya di HP untuk memasang."
