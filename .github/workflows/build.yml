                          JSONArray msgs = new JSONArray();
                          int start = Math.max(0, hist.size() - 10);
                          for (int i = start; i < hist.size(); i++) msgs.put(hist.get(i));
                          if (msgs.length() > 0 && !"user".equals(msgs.getJSONObject(0).optString("role"))) msgs.remove(0);
                          JSONObject userMsg = jpegB64 != null ? Claude.userImage(jpegB64, text) : Claude.msg("user", text);
                          msgs.put(userMsg);
                          String answer = Claude.ask(key.trim(), systemPrompt(), msgs, jpegB64 != null ? 500 : 350);
                          hist.add(Claude.msg("user", jpegB64 != null ? "[foto dari kamera] " + text : text));
                          hist.add(Claude.msg("assistant", answer));
                          while (hist.size() > 20) hist.remove(0);
                          speak(answer, null);
                          status(chatMode ? "Mode ngobrol aktif." : "Siaga. Ucapkan \"Hi JARVIS\".");
