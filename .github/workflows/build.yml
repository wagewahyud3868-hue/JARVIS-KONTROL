name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bongkar zip
        run: unzip -o jarvis-kontrol.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: jarvis-kontrol
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp jarvis-kontrol/app/build/outputs/apk/debug/app-debug.apk JARVIS-Kontrol.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: JARVIS Kontrol v1.${{ github.run_number }}
          body: Unduh JARVIS-Kontrol.apk di bawah, lalu buka file-nya di HP untuk memasang.
          files: JARVIS-Kontrol.apk
