                  startForegroundService(new Intent(this, JarvisService.class));
                  tvStatus.setText("Menyalakan JARVIS…");
                  btnPower.postDelayed(this::refreshPower, 800);
              }

              // ------------------------------------------------------------------ permissions

              String[] runtimePerms() {
                  List<String> p = new ArrayList<>();
                  Collections.addAll(p, Manifest.permission.RECORD_AUDIO, Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.CAMERA,
                          Manifest.permission.READ_PHONE_STATE, Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.ANSWER_PHONE_CALLS, Manifest.permission.READ_CONTACTS);
                  if (Build.VERSION.SDK_INT >= 31) {
                      p.add(Manifest.permission.BLUETOOTH_CONNECT);
                      p.add(Manifest.permission.BLUETOOTH_SCAN);
                  }
                  if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.POST_NOTIFICATIONS);
                  return p.toArray(new String[0]);
              }

              void askPerms() {
                  List<String> need = new ArrayList<>();
                  for (String s : runtimePerms()) {
                      if (checkSelfPermission(s) != PackageManager.PERMISSION_GRANTED) need.add(s);
                  }
                  if (need.isEmpty()) {
                      tvStatus.setText("Semua izin utama sudah diberikan.");
                      return;
                  }
                  requestPermissions(need.toArray(new String[0]), REQ);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  refreshPerms();
              }

              boolean batteryFree() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
              }

              void refreshPerms() {
                  int ok = 0;
                  String[] all = runtimePerms();
                  for (String s : all) if (checkSelfPermission(s) == PackageManager.PERMISSION_GRANTED) ok++;
                  String sb = (ok == all.length ? "✓ " : "✗ ") + "Izin utama: " + ok + "/" + all.length + "\n"
                          + (Settings.canDrawOverlays(this) ? "✓ " : "✗ ") + "Tampil di atas aplikasi lain (buka Maps)\n"
                          + (batteryFree() ? "✓ " : "✗ ") + "Bebas pembatasan baterai (siaga terus)";
                  tvPerm.setText(sb);
              }

              void openSetting(Intent i) {
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                      } catch (Exception ignored) { }
                  }
              }

              // ------------------------------------------------------------------ voices & settings

              void loadVoices() {
                  voiceNames.clear();
                  voiceNames.add("Bawaan HP");
                  try {
                      List<String> names = new ArrayList<>();
                      for (Voice v : previewTts.getVoices()) {
                          String lang = v.getLocale().getLanguage();
                          if ((lang.equals("id") || lang.equals("in")) && !v.isNetworkConnectionRequired()) names.add(v.getName());
                      }
                      for (Voice v : previewTts.getVoices()) {
                          String lang = v.getLocale().getLanguage();
                          if ((lang.equals("id") || lang.equals("in")) && v.isNetworkConnectionRequired()) names.add(v.getName());
                      }
                      voiceNames.addAll(names);
                  } catch (Exception ignored) { }
                  ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, voiceNames);
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  spVoice.setAdapter(ad);
                  String cur = prefs.getString("voice", "");
                  int idx = voiceNames.indexOf(cur);
                  spVoice.setSelection(Math.max(0, idx));
              }

              void testVoice() {
                  saveText();
                  if (previewTts == null) return;
                  previewTts.setPitch(prefs.getFloat("pitch", 0.8f));
                  previewTts.setSpeechRate(prefs.getFloat("rate", 0.95f));
                  String name = prefs.getString("voice", "");
                  boolean set = false;
                  try {
                      for (Voice v : previewTts.getVoices()) {
                          if (v.getName().equals(name)) {
                              previewTts.setVoice(v);
                              set = true;
                              break;
                          }
                      }
                  } catch (Exception ignored) { }
                  if (!set) previewTts.setLanguage(new Locale("id", "ID"));
                  String nick = prefs.getString("nick", "Bos");
                  previewTts.speak("Selamat datang, " + nick + ". Semua sistem siap. Ada yang bisa saya bantu?",
                          TextToSpeech.QUEUE_FLUSH, null, "tes");
              }

              void saveText() {
                  if (etKey == null) return;
                  prefs.edit()
                          .putString("apikey", etKey.getText().toString().trim())
                          .putString("nick", etNick.getText().toString().trim().isEmpty() ? "Bos" : etNick.getText().toString().trim())
                          .apply();
              }

