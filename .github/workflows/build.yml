                      speak("Maaf " + bos() + ", pesan ini tidak bisa dibalas dari JARVIS.", null);
                      return;
                  }
                  try {
                      RemoteInput[] ris = m.reply.getRemoteInputs();
                      Intent fill = new Intent();
                      Bundle b = new Bundle();
                      for (RemoteInput ri : ris) b.putCharSequence(ri.getResultKey(), msg);
                      RemoteInput.addResultsToIntent(ris, fill, b);
                      m.reply.actionIntent.send(this, 0, fill);
                      speak("Terkirim ke " + m.from + ", " + bos() + ".", null);
                  } catch (Exception e) {
                      speak("Maaf " + bos() + ", gagal mengirim balasan.", null);
                  }
              }
