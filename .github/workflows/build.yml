              void setupPhone() {
                  if (!granted(Manifest.permission.READ_PHONE_STATE)) return;
                  try {
                      tm = (TelephonyManager) getSystemService(Context.TELEPHONY_SERVICE);
                      psl = new PhoneStateListener() {
                          @Override
                          public void onCallStateChanged(int state, String number) {
                              if (state == TelephonyManager.CALL_STATE_RINGING) {
                                  ringing = true;
                                  inCall = false;
                                  if (prefs.getBoolean("announceCall", true)) {
                                      String name = contactName(number);
                                      String who = name != null ? name
                                              : (number != null && !number.isEmpty() ? "nomor " + spaced(number) : "nomor tidak dikenal");
                                      speak(bos() + ", ada telepon dari " + who + ". Angkat atau tolak?", null);
                                  }
                              } else if (state == TelephonyManager.CALL_STATE_OFFHOOK) {
                                  ringing = false;
                                  inCall = true;
                                  stopRecognizer();
                                  status("Sedang menelepon. JARVIS istirahat sebentar.");
                              } else {
                                  boolean was = ringing || inCall;
                                  ringing = false;
                                  inCall = false;
                                  if (was) {
                                      status("Siaga. Ucapkan \"Hi JARVIS\".");
                                      setupSco(true);
                                      restartSoon(1500);
                                  }
                              }
                          }
                      };
                      tm.listen(psl, PhoneStateListener.LISTEN_CALL_STATE);
                  } catch (Exception e) {
                      log("Sistem", "Fitur telepon tidak aktif: " + e.getMessage());
                  }
              }

              static String spaced(String num) {
                  StringBuilder sb = new StringBuilder();
                  for (char ch : num.toCharArray()) {
                      if (Character.isDigit(ch)) sb.append(ch).append(' ');
                  }
                  return sb.toString().trim();
              }

              String contactName(String number) {
                  if (number == null || number.isEmpty() || !granted(Manifest.permission.READ_CONTACTS)) return null;
                  Cursor c = null;
                  try {
                      Uri u = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number));
                      c = getContentResolver().query(u, new String[]{ContactsContract.PhoneLookup.DISPLAY_NAME}, null, null, null);
                      if (c != null && c.moveToFirst()) return c.getString(0);
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return null;
              }

