                          else if (e.code == 429) speak("Maaf " + bos() + ", terlalu banyak permintaan. Coba sebentar lagi.", null);
                          else if (e.code == 400 && e.getMessage() != null && e.getMessage().toLowerCase().contains("credit")) speak("Maaf " + bos() + ", saldo API Claude habis.", null);
                          else speak("Maaf " + bos() + ", Claude sedang bermasalah.", null);
                          log("Sistem", "API " + e.code + ": " + e.getMessage());
                      } catch (Exception e) {
                          speak("Maaf " + bos() + ", koneksi internet bermasalah.", null);
                          log("Sistem", "Error: " + e.getMessage());
                      }
                  });
              }

