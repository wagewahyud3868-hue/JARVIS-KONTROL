              // ------------------------------------------------------------------ command router

              static boolean has(String s, String regex) {
                  return Pattern.compile(regex, Pattern.CASE_INSENSITIVE).matcher(s).find();
              }

              void heard(String t) {
                  if (t.isEmpty()) return;
                  String low = t.toLowerCase(Locale.ROOT);
                  long now = System.currentTimeMillis();

                  if (ringing) {
                      log("Anda", t);
                      if (has(low, "\\b(angkat|terima|jawab|halo|iya|ya)\\b")) answerCall();
                      else if (has(low, "\\b(tolak|jangan|nanti|tutup|matikan|sibuk)\\b")) rejectCall();
                      return;
                  }

                  if (transMode) {
                      log(theirTurn ? "Mereka" : "Anda", t);
                      translateTurn(t);
                      return;
                  }

                  Matcher m = WAKE.matcher(low);
                  if (m.find()) {
                      log("Anda", t);
                      String rest = low.substring(m.end()).trim();
                      shutUp();
                      if (rest.isEmpty()) {
                          awaiting = true;
                          awaitUntil = now + 8000;
                          chime();
                          status("Mendengarkan perintah…");
                          return;
                      }
                      command(rest);
                      return;
                  }
                  if (awaiting && now < awaitUntil) {
                      awaiting = false;
                      log("Anda", t);
                      command(low);
                      return;
                  }
                  if (chatMode && now < chatUntil) {
                      log("Anda", t);
                      command(low);
                      return;
                  }
                  if (chatMode) {
                      chatMode = false;
                      status("Siaga. Ucapkan \"Hi JARVIS\".");
                  }
              }

              void command(String c) {
                  awaiting = false;
                  long now = System.currentTimeMillis();
                  if (chatMode) chatUntil = now + 60000;

                  if (has(c, "^(berhenti|diam|stop|cukup|sudah|udah)\\b") && c.length() < 20) {
                      if (chatMode) {
                          chatMode = false;
                          speak("Oke " + bos() + ", saya kembali siaga.", null);
                      } else {
                          shutUp();
                      }
                      return;
                  }
                  if (has(c, "(ngobrol|mengobrol|temani (aku|saya)|curhat|ayo (cerita|bicara))")) {
                      if (!hasKey()) {
                          openWebJarvis("Ngobrol dengan Claude butuh API key.");
                          return;
                      }
                      chatMode = true;
                      chatUntil = now + 60000;
                      status("Mode ngobrol: bicara langsung tanpa \"Hi JARVIS\". Bilang \"udahan\" untuk berhenti.");
                      askClaude(c + " (Pengguna ingin ngobrol santai. Sambut dengan hangat dan singkat, lalu ajak bicara.)", null);
                      return;
                  }
                  if (has(c, "(mode\\s*)?(penerjemah|terjemah(kan)?|translate|juru\\s*bahasa)") && c.length() < 70
                          && !has(c, "\\bartinya\\b")) {
                      startTranslate(c);
                      return;
                  }
                  if (has(c, "\\b(baca(kan)?|ada|balas|jawab)\\b.*\\b(pesan|whatsapp|wa|chat)\\b")) {
                      speak("Maaf " + bos() + ", fitur WhatsApp belum tersedia di versi ini karena diblokir Play Protect.", null);
                      return;
                  }
                  Matcher rp = Pattern.compile("^(balas|jawab)\\s*(pesan(nya)?|ke dia|dia)?\\s*[:,]?\\s*(.+)$", Pattern.CASE_INSENSITIVE).matcher(c);
                  if (rp.find() && lastWa != null) {
                      replyWhatsApp(rp.group(4).trim());
                      return;
                  }
                  if (has(c, "(di ?mana (aku|saya|posisi)|lokasi (ku|saya|aku)|posisiku|aku di mana|saya di mana)")) {
                      whereAmI();
                      return;
                  }
                  Matcher nav = Pattern.compile("(?:navigasi(?:kan)?|antar(?:kan)?|arahkan|rute|tunjukkan\\s+jalan|jalan|pergi|berangkat)\\s*(?:aku|saya|gue|kami)?\\s*(?:ke|menuju)\\s+(.+)", Pattern.CASE_INSENSITIVE).matcher(c);
                  if (nav.find()) {
                      String dest = cleanPlace(nav.group(1));
                      if (!dest.isEmpty()) {
                          navigate(dest, c);
                          return;
                      }
                  }
                  Matcher near = Pattern.compile("(?:cari(?:kan)?\\s+|di\\s*mana\\s+|dimana\\s+|ada\\s+)?(.+?)\\s*(?:yang\\s*)?(?:terdekat|dekat\\s*sini|di\\s*sekitar(?:\\s*sini)?|sekitar\\s*sini)\\b", Pattern.CASE_INSENSITIVE).matcher(c);
                  if (near.find()) {
                      String q = cleanPlace(near.group(1));
                      if (!q.isEmpty()) {
                          findNearby(q);
                          return;
                      }
                  }
                  if (has(c, "(deteksi|detect|identifikasi|scan|pindai|apa (saja )?(yang )?(ada )?di depan|depan (ku|saya|aku)|lihat (sekitar|sekeliling))")) {
                      camera("Deteksi dan sebutkan semua yang terlihat di depan pengguna: benda, orang, tulisan, rambu, dan potensi bahaya. Jelaskan singkat dan jelas, mulai dari yang paling penting, seolah pengguna tidak bisa melihat.");
                      return;
                  }
                  if (has(c, "(ambil|ambilkan|jepret|potret)\\s*(kan\\s*)?(foto|gambar)|^(foto(kan)?|jepret)\\b")) {
                      camera("Jelaskan singkat apa yang terlihat di foto ini.");
                      return;
                  }
                  if (has(c, "^(baca|bacakan)\\s+(tulisan|teks)|tulisan (di depan|ini) (apa|bacanya)")) {
                      camera("Bacakan semua tulisan yang terlihat di foto ini apa adanya. Kalau bukan bahasa Indonesia, sertakan terjemahannya.");
                      return;
                  }
                  if (has(c, "^(jam berapa|pukul berapa|sekarang jam)")) {
