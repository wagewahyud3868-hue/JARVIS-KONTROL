              static String shrink(byte[] jpeg) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(jpeg, 0, jpeg.length, o);
                      int sample = 1;
                      while (Math.max(o.outWidth, o.outHeight) / sample > 1400) sample *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = sample;
                      Bitmap bm = BitmapFactory.decodeByteArray(jpeg, 0, jpeg.length, o2);
                      if (bm == null) return Base64.encodeToString(jpeg, Base64.NO_WRAP);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      bm.compress(Bitmap.CompressFormat.JPEG, 80, bo);
                      bm.recycle();
                      return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) {
                      return Base64.encodeToString(jpeg, Base64.NO_WRAP);
                  }
              }

