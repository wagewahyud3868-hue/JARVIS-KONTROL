          /** Klien sederhana untuk Claude Messages API. */
          final class Claude {
              static final String URL_API = "https://api.anthropic.com/v1/messages";
              static final String MODEL = "claude-haiku-5-5";

              static class ApiError extends IOException {
                  final int code;
                  ApiError(int code, String msg) {
                      super(msg);
                      this.code = code;
                  }
              }

              private Claude() { }

              static String ask(String apiKey, String system, JSONArray messages, int maxTokens) throws Exception {
                  JSONObject body = new JSONObject();
                  body.put("model", MODEL);
                  body.put("max_tokens", maxTokens);
                  body.put("system", system);
                  body.put("messages", messages);

                  HttpURLConnection c = (HttpURLConnection) new URL(URL_API).openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(60000);
                  c.setDoOutput(true);
                  c.setRequestProperty("content-type", "application/json");
                  c.setRequestProperty("x-api-key", apiKey);
                  c.setRequestProperty("anthropic-version", "2023-06-01");
                  byte[] out = body.toString().getBytes(StandardCharsets.UTF_8);
                  OutputStream os = c.getOutputStream();
                  os.write(out);
                  os.close();

                  int code = c.getResponseCode();
                  InputStream is = (code >= 200 && code < 300) ? c.getInputStream() : c.getErrorStream();
                  String resp = readAll(is);
                  c.disconnect();
                  if (code < 200 || code >= 300) {
                      String msg = resp;
                      try {
                          msg = new JSONObject(resp).getJSONObject("error").getString("message");
                      } catch (Exception ignored) { }
                      throw new ApiError(code, msg);
                  }
                  JSONObject j = new JSONObject(resp);
                  JSONArray content = j.getJSONArray("content");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < content.length(); i++) {
                      JSONObject b = content.getJSONObject(i);
                      if ("text".equals(b.optString("type"))) sb.append(b.optString("text"));
                  }
                  return sb.toString().trim();
              }

              static JSONObject msg(String role, String text) throws JSONException {
                  return new JSONObject().put("role", role).put("content", text);
              }

              static JSONObject userImage(String b64Jpeg, String text) throws JSONException {
                  JSONArray parts = new JSONArray();
                  JSONObject src = new JSONObject()
                          .put("type", "base64")
                          .put("media_type", "image/jpeg")
                          .put("data", b64Jpeg);
                  parts.put(new JSONObject().put("type", "image").put("source", src));
                  parts.put(new JSONObject().put("type", "text").put("text", text));
                  return new JSONObject().put("role", "user").put("content", parts);
              }

              static String readAll(InputStream is) throws IOException {
