                      return;
                  }
                  askClaude(c, null);
              }

              static String cleanPlace(String t) {
                  return t.replaceAll("(?i)\\b(dong|ya|yuk|sekarang|tolong|pakai|naik|lewat|jalan kaki)\\b.*$", "")
                          .replaceAll("[.,!?]+$", "").trim();
