          /** Memotret satu foto dari kamera belakang HP tanpa layar (tanpa ketuk). */
          @SuppressLint("MissingPermission")
          final class CameraShot {

              interface Done {
                  void ok(byte[] jpeg);
                  void fail(String why);
              }

              private final Context ctx;
              private final Done done;
              private final HandlerThread thread = new HandlerThread("jarvis-cam");
              private Handler h;
              private CameraDevice cam;
              private CameraCaptureSession session;
              private ImageReader reader;
              private SurfaceTexture texture;
              private Surface preview;
              private boolean finished = false;

              private CameraShot(Context ctx, Done done) {
                  this.ctx = ctx.getApplicationContext();
                  this.done = done;
              }

              static void take(Context ctx, Done done) {
                  new CameraShot(ctx, done).start();
              }

              private void start() {
                  thread.start();
                  h = new Handler(thread.getLooper());
                  h.postDelayed(() -> finish(null, "Kamera tidak merespons."), 9000);
                  try {
                      CameraManager cm = (CameraManager) ctx.getSystemService(Context.CAMERA_SERVICE);
                      String id = null;
                      for (String cid : cm.getCameraIdList()) {
                          Integer f = cm.getCameraCharacteristics(cid).get(CameraCharacteristics.LENS_FACING);
                          if (f != null && f == CameraCharacteristics.LENS_FACING_BACK) {
                              id = cid;
                              break;
                          }
                      }
                      if (id == null) {
                          finish(null, "Kamera belakang tidak ditemukan.");
                          return;
                      }
                      CameraCharacteristics ch = cm.getCameraCharacteristics(id);
                      Integer so = ch.get(CameraCharacteristics.SENSOR_ORIENTATION);
                      final int orientation = so != null ? so : 90;
                      Size pick = new Size(1280, 960);
                      StreamConfigurationMap map = ch.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP);
                      if (map != null) {
                          Size best = null;
                          for (Size s : map.getOutputSizes(ImageFormat.JPEG)) {
                              if (s.getWidth() > 1920) continue;
                              if (best == null || (long) s.getWidth() * s.getHeight() > (long) best.getWidth() * best.getHeight()) best = s;
                          }
                          if (best != null) pick = best;
                      }
                      reader = ImageReader.newInstance(pick.getWidth(), pick.getHeight(), ImageFormat.JPEG, 2);
                      reader.setOnImageAvailableListener(r -> {
                          Image img = null;
                          try {
                              img = r.acquireLatestImage();
                              if (img == null) return;
                              ByteBuffer buf = img.getPlanes()[0].getBuffer();
                              byte[] bytes = new byte[buf.remaining()];
                              buf.get(bytes);
                              finish(bytes, null);
                          } catch (Exception e) {
                              finish(null, "Gagal membaca foto.");
                          } finally {
                              if (img != null) img.close();
                          }
                      }, h);
                      texture = new SurfaceTexture(false);
                      texture.setDefaultBufferSize(640, 480);
                      preview = new Surface(texture);

                      cm.openCamera(id, new CameraDevice.StateCallback() {
                          @Override
                          public void onOpened(CameraDevice c) {
                              cam = c;
                              try {
                                  c.createCaptureSession(Arrays.asList(preview, reader.getSurface()),
                                          new CameraCaptureSession.StateCallback() {
                                              @Override
                                              public void onConfigured(CameraCaptureSession s) {
                                                  session = s;
                                                  try {
                                                      CaptureRequest.Builder pb = c.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW);
                                                      pb.addTarget(preview);
                                                      pb.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO);
                                                      s.setRepeatingRequest(pb.build(), null, h);
                                                      // beri waktu kamera menyesuaikan cahaya & fokus
                                                      h.postDelayed(() -> {
                                                          try {
                                                              CaptureRequest.Builder cb = c.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE);
                                                              cb.addTarget(reader.getSurface());
                                                              cb.set(CaptureRequest.JPEG_ORIENTATION, orientation);
                                                              cb.set(CaptureRequest.JPEG_QUALITY, (byte) 85);
                                                              s.capture(cb.build(), null, h);
                                                          } catch (Exception e) {
                                                              finish(null, "Gagal memotret.");
                                                          }
                                                      }, 1200);
                                                  } catch (Exception e) {
                                                      finish(null, "Kamera gagal disiapkan.");
                                                  }
                                              }

                                              @Override
                                              public void onConfigureFailed(CameraCaptureSession s) {
                                                  finish(null, "Kamera gagal disiapkan.");
                                              }
                                          }, h);
                              } catch (Exception e) {
                                  finish(null, "Kamera gagal disiapkan.");
                              }
                          }

                          @Override
                          public void onDisconnected(CameraDevice c) {
                              cam = c;
                              finish(null, "Kamera terputus.");
                          }

                          @Override
                          public void onError(CameraDevice c, int error) {
                              cam = c;
                              finish(null, "Kamera sedang dipakai aplikasi lain.");
                          }
                      }, h);
                  } catch (SecurityException e) {
                      finish(null, "Izin kamera belum diberikan.");
                  } catch (Exception e) {
                      finish(null, "Kamera tidak bisa dibuka.");
                  }
              }

              private synchronized void finish(byte[] jpeg, String err) {
                  if (finished) return;
                  finished = true;
                  try { if (session != null) session.close(); } catch (Exception ignored) { }
                  try { if (cam != null) cam.close(); } catch (Exception ignored) { }
                  try { if (reader != null) reader.close(); } catch (Exception ignored) { }
                  try { if (preview != null) preview.release(); } catch (Exception ignored) { }
                  try { if (texture != null) texture.release(); } catch (Exception ignored) { }
                  thread.quitSafely();
                  if (jpeg != null) done.ok(jpeg);
                  else done.fail(err != null ? err : "Kamera gagal.");
              }
          }
