              LinearLayout seek(String title, String key, float min, float max, float def) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  float cur = prefs.getFloat(key, def);
                  TextView t = text(title + ": " + String.format(Locale.ROOT, "%.2f", cur), 13, MUTED, false);
                  box.addView(t);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(100);
                  sb.setProgress(Math.round((cur - min) / (max - min) * 100));
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          float v = min + (max - min) * p / 100f;
                          t.setText(title + ": " + String.format(Locale.ROOT, "%.2f", v));
                          prefs.edit().putFloat(key, v).apply();
                      }

                      @Override public void onStartTrackingTouch(SeekBar s) { }
                      @Override public void onStopTrackingTouch(SeekBar s) { }
                  });
                  box.addView(sb);
                  return box;
              }

              CheckBox check(String title, String key, boolean def) {
                  CheckBox c = new CheckBox(this);
                  c.setText(title);
                  c.setTextColor(INK);
                  c.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  c.setChecked(prefs.getBoolean(key, def));
                  c.setOnCheckedChangeListener((b, on) -> prefs.edit().putBoolean(key, on).apply());
                  return c;
              }

              EditText edit(String value, String hint) {
                  EditText e = new EditText(this);
                  e.setText(value);
                  e.setHint(hint);
                  e.setTextColor(INK);
                  e.setHintTextColor(MUTED);
                  e.setSingleLine(true);
                  e.setBackground(field());
                  e.setPadding(dp(12), dp(10), dp(12), dp(10));
                  return e;
              }

              GradientDrawable field() {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xFF02070D);
                  g.setCornerRadius(dp(4));
                  g.setStroke(dp(1), LINE);
                  return g;
              }

              TextView label(String s) {
                  TextView t = text(s, 12, ACCENT, true);
                  t.setLetterSpacing(0.2f);
                  return t;
              }

              LinearLayout panel() {
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(16), dp(16), dp(16), dp(16));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(PANEL);
                  g.setCornerRadius(dp(4));
                  g.setStroke(dp(1), LINE);
                  p.setBackground(g);
                  return p;
              }

              TextView text(String s, int sp, int col, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(col);
                  t.setTypeface(Typeface.create("sans-serif-condensed", bold ? Typeface.BOLD : Typeface.NORMAL));
                  t.setLineSpacing(0, 1.15f);
                  return t;
              }

              Button button(String s, boolean primary) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setGravity(Gravity.CENTER);
                  b.setStateListAnimator(null);
                  b.setAllCaps(true);
                  b.setLetterSpacing(0.1f);
                  b.setTypeface(Typeface.create("sans-serif-condensed", Typeface.BOLD));
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  style(b, primary);
                  return b;
              }

              void style(Button b, boolean primary) {
                  b.setTextColor(primary ? ON_ACCENT : INK);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(primary ? ACCENT : PANEL);
                  g.setCornerRadius(dp(4));
                  g.setStroke(dp(1), primary ? ACCENT : LINE);
                  b.setBackground(g);
              }

              LinearLayout.LayoutParams lp(int l, int t, int r, int bt) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(l, t, r, bt);
                  return p;
              }

              LinearLayout.LayoutParams lpH(int h, int l, int t, int r, int bt) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, h);
                  p.setMargins(l, t, r, bt);
                  return p;
              }

              int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
